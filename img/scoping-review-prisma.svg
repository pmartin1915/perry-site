<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="t d">
  <title id="t">PRISMA flow diagram for the scoping review</title>
  <desc id="d">227 database records identified; 131 duplicates removed; 96 records screened and 61 excluded; 35 reports assessed for eligibility and 7 excluded; 28 studies included.</desc>
  <style>
    .card { fill: #ffffff; stroke: #c9ced6; }
    .box { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.2; }
    .key { fill: #e6f0fa; stroke: #0b5cad; stroke-width: 1.6; }
    .side { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .stage { fill: #0b5cad; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f2933; font-size: 15px; }
    .b { font-weight: 600; fill: #0b0f14; }
    .s { font-size: 13px; fill: #4b5563; }
    .st { fill: #ffffff; font-size: 13px; font-weight: 600; letter-spacing: .06em; }
    .arrow { stroke: #4b5563; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="719" height="599" rx="14"/>

  <!-- stage bands -->
  <rect class="stage" x="20" y="24" width="30" height="128" rx="6"/>
  <text class="st" transform="translate(40 88) rotate(-90)" text-anchor="middle">IDENTIFICATION</text>
  <rect class="stage" x="20" y="168" width="30" height="300" rx="6"/>
  <text class="st" transform="translate(40 318) rotate(-90)" text-anchor="middle">SCREENING</text>
  <rect class="stage" x="20" y="484" width="30" height="92" rx="6"/>
  <text class="st" transform="translate(40 530) rotate(-90)" text-anchor="middle">INCLUDED</text>

  <!-- identification -->
  <rect class="box" x="70" y="24" width="330" height="128" rx="8"/>
  <text x="86" y="52" class="b">Records from databases (n = 227)</text>
  <text x="86" y="78" class="s">PubMed 69 · Embase 79</text>
  <text x="86" y="100" class="s">Web of Science 76 · Cochrane 3</text>
  <text x="86" y="122" class="s">IEEE Xplore 0</text>
  <rect class="side" x="460" y="58" width="240" height="60" rx="8"/>
  <text x="476" y="93" >Duplicates removed (n = 131)</text>
  <path class="arrow" d="M400 88 H456"/>

  <!-- screening -->
  <path class="arrow" d="M235 152 V180"/>
  <rect class="box" x="70" y="184" width="330" height="56" rx="8"/>
  <text x="86" y="218" class="b">Records screened (n = 96)</text>
  <rect class="side" x="460" y="184" width="240" height="56" rx="8"/>
  <text x="476" y="217">Records excluded (n = 61)</text>
  <path class="arrow" d="M400 212 H456"/>

  <path class="arrow" d="M235 240 V268"/>
  <rect class="box" x="70" y="272" width="330" height="56" rx="8"/>
  <text x="86" y="306" class="b">Reports sought for retrieval (n = 35)</text>
  <rect class="side" x="460" y="272" width="240" height="56" rx="8"/>
  <text x="476" y="305">Not retrieved (n = 0)</text>
  <path class="arrow" d="M400 300 H456"/>

  <path class="arrow" d="M235 328 V356"/>
  <rect class="box" x="70" y="360" width="330" height="56" rx="8"/>
  <text x="86" y="394" class="b">Reports assessed (n = 35)</text>
  <rect class="side" x="460" y="360" width="240" height="56" rx="8"/>
  <text x="476" y="393">Reports excluded (n = 7)</text>
  <path class="arrow" d="M400 388 H456"/>

  <!-- included -->
  <path class="arrow" d="M235 416 V496"/>
  <rect class="key" x="70" y="500" width="330" height="64" rx="8"/>
  <text x="86" y="530" class="b">Studies included (n = 28)</text>
  <text x="86" y="551" class="s">PRISMA-ScR, searched January 2026</text>
</svg>
