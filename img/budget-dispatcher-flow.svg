<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d">
  <title id="t">budget-dispatcher run, simplified</title>
  <desc id="d">A scheduled run checks that the machine is idle and that unused capacity remains, picks a pre-approved task, and makes and commits the change. A change touching clinical domain or data directories in a flagged project goes to a review by a different model family; a critical finding reverts the commit. Every outcome is logged.</desc>
  <style>
    .card { fill: #ffffff; stroke: #c9ced6; }
    .box { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.2; }
    .gate { fill: #fff7ed; stroke: #b45309; stroke-width: 1.6; }
    .ok { fill: #e6f0fa; stroke: #0b5cad; stroke-width: 1.6; }
    .no { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 4 3; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f2933; font-size: 15px; }
    .b { font-weight: 600; fill: #0b0f14; }
    .s { font-size: 13px; fill: #4b5563; }
    .lab { font-size: 12px; fill: #4b5563; font-weight: 600; letter-spacing: .04em; }
    .arrow { stroke: #4b5563; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="719" height="559" rx="14"/>

  <rect class="box" x="40" y="24" width="300" height="52" rx="8"/>
  <text x="56" y="56" class="b">Scheduled run</text>

  <path class="arrow" d="M190 76 V100"/>
  <rect class="box" x="40" y="104" width="300" height="70" rx="8"/>
  <text x="56" y="132" class="b">Is the machine idle?</text>
  <text x="56" y="156" class="s">Is unused capacity left this cycle?</text>
  <rect class="no" x="420" y="112" width="260" height="54" rx="8"/>
  <text x="436" y="144">No: skip, log, wait</text>
  <path class="arrow" d="M340 139 H416"/>

  <path class="arrow" d="M190 174 V198"/>
  <rect class="box" x="40" y="202" width="300" height="70" rx="8"/>
  <text x="56" y="230" class="b">Pick a pre-approved task</text>
  <text x="56" y="254" class="s">Bounded and reversible, per project</text>

  <path class="arrow" d="M190 272 V296"/>
  <rect class="box" x="40" y="300" width="300" height="52" rx="8"/>
  <text x="56" y="332" class="b">Make and commit the change</text>

  <path class="arrow" d="M190 352 V376"/>
  <rect class="gate" x="40" y="380" width="300" height="70" rx="8"/>
  <text x="56" y="408" class="b">Clinical gate</text>
  <text x="56" y="432" class="s">Flagged project, domain or data paths</text>

  <rect class="gate" x="420" y="380" width="260" height="70" rx="8"/>
  <text x="436" y="408" class="b">Cross-family review</text>
  <text x="436" y="432" class="s">A different model family checks it</text>
  <path class="arrow" d="M340 415 H416"/>
  <text x="352" y="406" class="lab">FLAGGED</text>

  <rect class="no" x="420" y="478" width="260" height="58" rx="8"/>
  <text x="436" y="504" class="b">Critical finding</text>
  <text x="436" y="524" class="s">Commit reverted, outcome logged</text>
  <path class="arrow" d="M550 450 V474"/>

  <path class="arrow" d="M190 450 V474"/>
  <rect class="ok" x="40" y="478" width="300" height="58" rx="8"/>
  <text x="56" y="504" class="b">Lands, outcome logged</text>
  <text x="56" y="524" class="s">Unflagged, or review passed</text>
  <path class="arrow" d="M420 470 L344 486"/>
  <text x="366" y="466" class="lab">PASS</text>

  <text x="704" y="550" class="s" text-anchor="end" font-size="11">Simplified</text>
</svg>
